name: ep0
on:
  push:
  pull_request:
jobs:
  ep0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: EP-0 probe reproduces the recorded outcome
        run: python tools/ep0_probe.py
      - name: EP-0 sabotage must exit 1
        run: |
          if python tools/ep0_probe.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
