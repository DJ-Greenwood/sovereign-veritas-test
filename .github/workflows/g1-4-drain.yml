name: g1-4-drain
on:
  push:
  pull_request:
jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: drain probe reproduces the recorded outcome
        run: python tools/g1_4_drain_probe.py
      - name: drain probe sabotage must exit 1
        run: |
          if python tools/g1_4_drain_probe.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
